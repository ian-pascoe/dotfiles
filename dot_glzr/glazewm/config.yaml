    commands:
      - wm-enable-binding-mode --name service
  - bindings:
      - alt+ctrl+r
    commands:
      - wm-enable-binding-mode --name resize
  - bindings:
      - alt+shift+p
    commands:
      - wm-toggle-pause
binding_modes:
  - name: resize
    keybindings:
      - bindings:
          - h
          - left
        commands:
          - resize --width -3%
      - bindings:
          - j
          - down
        commands:
          - resize --height +3%
      - bindings:
          - k
          - up
        commands:
          - resize --height -3%
      - bindings:
          - l
          - right
        commands:
          - resize --width +3%
      - bindings:
          - shift+h
          - shift+left
        commands:
          - resize --width -1%
      - bindings:
          - shift+j
          - shift+down
        commands:
          - resize --height +1%
      - bindings:
          - shift+k
          - shift+up
        commands:
          - resize --height -1%
      - bindings:
          - shift+l
          - shift+right
        commands:
          - resize --width +1%
      - bindings:
          - escape
          - enter
        commands:
          - wm-disable-binding-mode --name resize
  - name: service
    keybindings:
      - bindings:
          - escape
        commands:
          - wm-disable-binding-mode --name service
          - wm-reload-config
      - bindings:
          - enter
        commands:
          - wm-disable-binding-mode --name service
      - bindings:
          - r
        commands:
          - wm-redraw
          - wm-disable-binding-mode --name service
      - bindings:
          - f
        commands:
          - toggle-floating --centered
          - wm-disable-binding-mode --name service
      - bindings:
          - space
        commands:
          - wm-cycle-focus
          - wm-disable-binding-mode --name service
      - bindings:
          - shift+e
        commands:
          - wm-disable-binding-mode --name service
          - wm-exit
workspaces:
  - keep_alive: true
    bind_to_monitor: 0
    name: "1"
  - keep_alive: true
    bind_to_monitor: 0
    name: "2"
  - keep_alive: true
    bind_to_monitor: 0
    name: "3"
  - keep_alive: true
    bind_to_monitor: 0
    name: "4"
  - keep_alive: true
    bind_to_monitor: 0
    name: "5"
  - keep_alive: true
    bind_to_monitor: 1
    name: "6"
  - keep_alive: true
    bind_to_monitor: 1
    name: "7"
  - keep_alive: true
    bind_to_monitor: 1
    name: "8"
  - keep_alive: true
    bind_to_monitor: 1
    name: "9"
gaps:
  outer_gap:
    right: 5px
    left: 5px
    top: 5px
    bottom: 5px
  inner_gap: 5px
  scale_with_dpi: true
