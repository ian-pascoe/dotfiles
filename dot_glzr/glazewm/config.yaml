general:
  shutdown_commands: []
  cursor_jump:
    trigger: monitor_focus
    enabled: true
  show_all_in_taskbar: false
  hide_method: cloak
  config_reload_commands: []
  focus_follows_cursor: false
  startup_commands: []
  toggle_workspace_on_refocus: false
window_rules:
  - commands:
      - ignore
    match:
      - window_title:
          regex: "[Pp]icture.in.[Pp]icture"
        window_class:
          regex: Chrome_WidgetWin_1|MozillaDialogClass
      - window_process:
          equals: keyviz
window_behavior:
  state_defaults:
    fullscreen:
      maximized: false
      shown_on_top: false
    floating:
      shown_on_top: false
      centered: true
  initial_state: tiling
window_effects:
  focused_window:
    transparency:
      opacity: 95%
      enabled: false
    corner_style:
      style: rounded
      enabled: true
    hide_title_bar:
      enabled: false
    border:
      color: "#EBBCBA"
      enabled: true
  other_windows:
    transparency:
      opacity: 95%
      enabled: true
    corner_style:
      style: rounded
      enabled: true
    hide_title_bar:
      enabled: false
    border:
      color: "#403D52"
      enabled: true
keybindings:
  - bindings:
      - alt+enter
    commands:
      - shell-exec %SCOOP%\apps\windows-terminal\current\wt.exe
  - bindings:
      - alt+shift+enter
      - alt+shift+b
    commands:
      - shell-exec %SCOOP%\apps\zen-browser\current\zen.exe
  - bindings:
      - alt+k
    commands:
      - shell-exec %USERPROFILE%\.config\keybindings\cheatsheet.html
  - bindings:
      - alt+q
    commands:
      - close
  - bindings:
      - alt+j
    commands:
      - toggle-tiling-direction
  - bindings:
      - alt+t
    commands:
      - toggle-floating --centered
  - bindings:
      - alt+f
    commands:
      - toggle-fullscreen
  - bindings:
      - alt+m
    commands:
      - toggle-minimized
  - bindings:
      - alt+left
    commands:
      - focus --direction left
  - bindings:
      - alt+down
    commands:
      - focus --direction down
  - bindings:
      - alt+up
    commands:
      - focus --direction up
  - bindings:
      - alt+right
    commands:
      - focus --direction right
  - bindings:
      - alt+shift+left
    commands:
      - move --direction left
  - bindings:
      - alt+shift+down
    commands:
      - move --direction down
  - bindings:
      - alt+shift+up
    commands:
      - move --direction up
  - bindings:
      - alt+shift+right
