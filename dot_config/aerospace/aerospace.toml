# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

# Start AeroSpace at login
# false, because handled by launchd
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
exec-on-workspace-change = []

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# Bindings follow Omarchy's Hyprland defaults (github.com/basecamp/omarchy,
# default/hypr/bindings/), with cmd standing in for SUPER. Omarchy actions with no
# AeroSpace equivalent are left out, so their cmd shortcuts keep their macOS meaning.
# cmd-space stays with Tinycast (Omarchy's SUPER+SPACE launcher menu).

# Applications
# A new window in the running Rex, then bring Rex forward (or launch it, which opens one).
cmd-enter = '''exec-and-forget "$HOME/Library/Application Support/com.superlogical.rex/RexServer/Versions/Current/Rex Server.app/Contents/MacOS/rex" --autostart=false do client.window.new >/dev/null 2>&1; open -a 'Rex Beta' '''
cmd-shift-enter = "exec-and-forget open -na 'Zen'"
cmd-shift-b = "exec-and-forget open -na 'Zen'"
cmd-k = 'exec-and-forget open -g hammerspoon://keybindings' # cheat sheet (Hammerspoon)

# Windows. cmd-w is left to apps, whose macOS default already closes the window or tab.
cmd-q = 'close'
cmd-j = 'layout horizontal vertical' # toggle split
cmd-t = 'layout floating tiling' # toggle floating
cmd-f = 'fullscreen'
cmd-m = 'macos-native-minimize'
cmd-l = 'layout tiles accordion' # cycle workspace layout
cmd-alt-l = 'layout tiles accordion'

# Focus
cmd-left = 'focus left --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-down = 'focus down --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-up = 'focus up --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
cmd-right = 'focus right --boundaries all-monitors-outer-frame --boundaries-action wrap-around-all-monitors'
alt-tab = 'focus dfs-next --boundaries-action wrap-around-the-workspace'
alt-shift-tab = 'focus dfs-prev --boundaries-action wrap-around-the-workspace'
ctrl-alt-tab = 'focus-monitor --wrap-around next'
ctrl-alt-shift-tab = 'focus-monitor --wrap-around prev'

# Swap windows
cmd-shift-left = 'swap left'
cmd-shift-down = 'swap down'
cmd-shift-up = 'swap up'
cmd-shift-right = 'swap right'

# Resize: minus/equal change width, add shift for height; alt is a little, ctrl a lot.
cmd-minus = 'resize width -100'
cmd-equal = 'resize width +100'
cmd-shift-minus = 'resize height -100'
cmd-shift-equal = 'resize height +100'
cmd-alt-minus = 'resize width -25'
cmd-alt-equal = 'resize width +25'
cmd-shift-alt-minus = 'resize height -25'
cmd-shift-alt-equal = 'resize height +25'
cmd-ctrl-minus = 'resize width -300'
cmd-ctrl-equal = 'resize width +300'
cmd-ctrl-shift-minus = 'resize height -300'
cmd-ctrl-shift-equal = 'resize height +300'

# Workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

# Move window to workspace and follow it
cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

# Move window to workspace silently
cmd-shift-alt-1 = 'move-node-to-workspace 1'
cmd-shift-alt-2 = 'move-node-to-workspace 2'
cmd-shift-alt-3 = 'move-node-to-workspace 3'
cmd-shift-alt-4 = 'move-node-to-workspace 4'
cmd-shift-alt-5 = 'move-node-to-workspace 5'
cmd-shift-alt-6 = 'move-node-to-workspace 6'
cmd-shift-alt-7 = 'move-node-to-workspace 7'
cmd-shift-alt-8 = 'move-node-to-workspace 8'
cmd-shift-alt-9 = 'move-node-to-workspace 9'

cmd-tab = 'exec-and-forget aerospace list-workspaces --monitor focused --empty no | aerospace workspace --wrap-around --stdin next'
cmd-shift-tab = 'exec-and-forget aerospace list-workspaces --monitor focused --empty no | aerospace workspace --wrap-around --stdin prev'
cmd-ctrl-tab = 'workspace-back-and-forth'

# Monitors
cmd-shift-alt-left = 'move-workspace-to-monitor left'
cmd-shift-alt-right = 'move-workspace-to-monitor right'
cmd-shift-alt-up = 'move-workspace-to-monitor up'
cmd-shift-alt-down = 'move-workspace-to-monitor down'
cmd-shift-ctrl-left = 'move-node-to-monitor --focus-follows-window left'
cmd-shift-ctrl-right = 'move-node-to-monitor --focus-follows-window right'
cmd-shift-ctrl-up = 'move-node-to-monitor --focus-follows-window up'
cmd-shift-ctrl-down = 'move-node-to-monitor --focus-follows-window down'

# AeroSpace-only modes (no Omarchy equivalent)
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-shift-semicolon = ['mode service']
cmd-ctrl-r = 'mode resize'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']


cmd-shift-left = ['join-with left', 'mode main']
cmd-shift-down = ['join-with down', 'mode main']
cmd-shift-up = ['join-with up', 'mode main']
cmd-shift-right = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'

shift-h = 'resize width -10'
shift-j = 'resize height +10'
shift-k = 'resize height -10'
shift-l = 'resize width +10'

enter = ['mode main']
esc = ['mode main']

[workspace-to-monitor-force-assignment]
1 = 1
2 = 1
3 = 1
4 = 1
5 = [2, 1]
6 = [2, 1]
7 = [2, 1]
8 = [2, 1]
9 = [2, 1]
