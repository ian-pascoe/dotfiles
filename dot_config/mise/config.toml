[settings]
aqua.github_attestations = false

# Shared CLI ownership lives here. OS packages/libraries stay in apt, Scoop and Brew.
[tools]
7zip = "latest"
actionlint = "latest"
ast-grep = "latest"
aube = "latest"
awscli = "latest"
bat = "latest"
# These upstream packages are Linux-only
btop = { version = "latest", os = ["linux"] }
bun = "latest"
cargo-binstall = "latest"
cargo-deny = "latest"
chezmoi = "latest"
clang-format = "latest"
claude = "latest"
cloudflared = "latest"
cmake = "latest"
crane = "latest"
dart = "latest"
delta = "latest"
dotnet = "latest"
fastfetch = "latest"
fd = "latest"
ffmpeg = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
glow = "latest"
go = "latest"
google-java-format = "latest"
goreleaser = "latest"
gradle = "latest"
helm = "latest"
herdr = "latest"
imagemagick = "latest"
java = ["25", "21"]
jq = "latest"
just = "latest"
k9s = "latest"
ktlint = "latest"
kubectl = "latest"
lazydocker = "latest"
lazygit = "latest"
lsd = "latest"
lua = "latest"
lua-language-server = "latest"
markdownlint-cli2 = "latest"
marksman = "latest"
maven = "latest"
mold = { version = "latest", os = ["linux"] }
neovim = "latest"
ninja = "latest"
node = "latest"
nushell = "latest"
oxfmt = "latest"
oxlint = "latest"
# The PHP backend builds from source; system development libraries are still required.
php = { version = "latest", os = ["linux", "macos"] }
pi = "latest"
pipx = "latest"
playwright = "latest"
pnpm = "latest"
powershell = "latest"
python = ["latest", "3.13"]
resvg = "latest"
ripgrep = "latest"
ruby = "latest"
ruff = "latest"
rust = "stable"
sccache = "latest"
semgrep = "latest"
shellcheck = "latest"
shfmt = "latest"
sqlite = "latest"
starship = "latest"
stylua = "latest"
syncthing = "latest"
taplo = "latest"
terraform = "latest"
terraform-ls = "latest"
tree-sitter = "latest"
uv = "latest"
viteplus = "latest"
wrangler = "latest"
yazi = "latest"
yq = "latest"
yt-dlp = "latest"
zellij = "latest"
zig = "latest"
zls = "latest"
zoxide = "latest"

# Explicit backends cover tools without a registry shorthand.
# R packages (including languageserver) must be installed into the selected R separately.
"conda:r-base" = { version = "latest", os = ["linux", "macos", "windows/x64"] }

"dotnet:csharp-ls" = "latest"
"dotnet:csharpier" = "latest"

"gem:ruby-lsp" = "latest"
# Projects using `bundle exec rubocop` must also declare it in their Gemfile.
"gem:rubocop" = "latest"

# Official clangd archives target x64; avoid the indexing-tools/debug-symbols assets.
"github:clangd/clangd" = { version = "latest", asset_pattern = 'clangd-{{ os(macos="mac") }}-{{ version }}.zip', os = [
  "linux/x64",
  "macos/x64",
  "windows/x64",
] }
"github:PHP-CS-Fixer/PHP-CS-Fixer" = { version = "latest", asset_pattern = "php-cs-fixer.phar", bin = "php-cs-fixer", os = [
  "linux",
  "macos",
] }
# `air` in the registry is the Go live-reload tool, not Posit's R formatter.
"github:posit-dev/air" = "latest"
# Linear's issues from the shell (`linear issue …`); the agents' fallback when Executor's Linear app is unavailable.
"github:schpet/linear-cli" = "latest"

"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/simeji/jid/cmd/jid" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:mvdan.cc/gofumpt" = "latest"

"cargo:cargo-audit" = "latest"
"cargo:cargo-cache" = "latest"
"cargo:cargo-edit" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-run-bin" = "latest"
"cargo:cargo-update" = "latest"
"cargo:cargo-watch" = "latest"
"cargo:cargo-zigbuild" = "latest"
"cargo:cross" = "latest"
"cargo:lspctl" = "latest"
"cargo:plannotator-tui" = "latest"

"npm:@firecrawl/anydoc" = "latest"
"npm:@googleworkspace/cli" = "latest"
# Low-download packages: npm provenance points to anomalyco/terminal-control's npm-release.yml.
"npm:@kitlangton/terminal-control-linux-x64-gnu" = { version = "latest", os = [
  "linux/x64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-linux-arm64-gnu" = { version = "latest", os = [
  "linux/arm64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-darwin-arm64" = { version = "latest", os = [
  "macos/arm64",
], allow_low_downloads = true }
"npm:@kitlangton/terminal-control-darwin-x64" = { version = "latest", os = [
  "macos/x64",
], allow_low_downloads = true }
"npm:agent-browser" = { version = "latest", allow_builds = ["agent-browser"] }
"npm:agent-desktop" = { version = "latest", allow_builds = ["agent-desktop"] }
"npm:alchemy" = { version = "next", allow_builds = ["alchemy"] }
# 2.0 betas are token-published without provenance; tarballs match the GitHub release assets.
"npm:executor" = { version = "beta", trust_policy_excludes = [
  "executor@2.0.0-beta.35 || 2.0.0-beta.35-darwin-arm64 || 2.0.0-beta.35-darwin-x64 || 2.0.0-beta.35-linux-arm64 || 2.0.0-beta.35-linux-x64 || 2.0.0-beta.35-win32-x64",
] }
"npm:hunkdiff" = "latest"
"npm:impeccable" = "latest"

# Language servers and formatters launched directly by Pi LSP and Pi Formatter.
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:intelephense" = "latest"
# oxlint's fallback type-aware backend: its `tsgolint` on PATH, used when OXLINT_TSGOLINT_PATH is unset. Pi's
# oxlint LSP points that at tsrs's `tsrs-lint` instead (settings.managed.json).
"npm:oxlint-tsgolint" = "latest"
"npm:pi-acp" = "latest"
"npm:rea-agents" = "latest"
"npm:skills" = "latest"
"npm:sql-language-server" = "latest"
# tsrs-lsp's fallback outside Effect projects, and the `tsrs-lint` backend for Pi's oxlint LSP. Pinned exactly:
# mise skips prereleases for `latest`, and every current tsrs is one (`latest` resolves to an unrelated 0.0.0).
# The exclusion: aube flags every trusted-publisher release as a downgrade from the maintainer's manual
# 0.0.0-bootstrap.0 placeholder. 0.24.0's SLSA provenance names oxc-project/tsrs's release.yml on main (checked
# 2026-11-13). Re-check provenance and move the exclusion with each version bump.
"npm:tsrs" = { version = "0.24.0-ts7.1.0-beta", trust_policy_excludes = [
  "tsrs@0.24.0-ts7.1.0-beta",
] }
"npm:typescript" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"

# PyYAML has no cp315 wheel; the source build lacks libyaml, so CLoader is missing.
"pipx:camoufox" = { version = "latest", python = "3.13" }
"pipx:pyflakes" = "latest"
"pipx:pytest" = "latest"
"pipx:spotdl" = "latest"
"pipx:trafilatura" = "latest"
