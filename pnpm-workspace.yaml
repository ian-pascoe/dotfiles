packages:
  - dot_pi/agent

allowBuilds:
  "@google/genai": true
  esbuild: true
  msgpackr-extract: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
