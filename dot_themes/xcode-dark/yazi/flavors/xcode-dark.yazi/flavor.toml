# Xcode Dark local Yazi flavor

[mgr]
cwd = { fg = "#4EB0CC" }
find_keyword = { fg = "#D9C97C", bold = true, italic = true }
find_position = { fg = "#B281EB", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#84B360", bg = "#84B360" }
marker_cut = { fg = "#FF8170", bg = "#FF8170" }
marker_marked = { fg = "#6BDFFF", bg = "#6BDFFF" }
marker_selected = { fg = "#D9C97C", bg = "#D9C97C" }
count_copied = { fg = "#292A30", bg = "#84B360" }
count_cut = { fg = "#292A30", bg = "#FF8170" }
count_selected = { fg = "#292A30", bg = "#D9C97C" }
border_symbol = "│"
border_style = { fg = "#53606E" }

[tabs]
active = { fg = "#292A30", bg = "#4EB0CC", bold = true }
inactive = { fg = "#4EB0CC", bg = "#2F3037" }

[mode]
normal_main = { fg = "#292A30", bg = "#4EB0CC", bold = true }
normal_alt = { fg = "#4EB0CC", bg = "#2F3037" }
select_main = { fg = "#292A30", bg = "#84B360", bold = true }
select_alt = { fg = "#84B360", bg = "#2F3037" }
unset_main = { fg = "#292A30", bg = "#B281EB", bold = true }
unset_alt = { fg = "#B281EB", bg = "#2F3037" }

[status]
perm_sep = { fg = "#53606E" }
perm_type = { fg = "#4EB0CC" }
perm_read = { fg = "#84B360" }
perm_write = { fg = "#D9C97C" }
perm_exec = { fg = "#FF8170" }
progress_label = { fg = "#DFDFE0", bold = true }
progress_normal = { fg = "#84B360", bg = "#414453" }
progress_error = { fg = "#292A30", bg = "#FF8170" }

[pick]
border = { fg = "#4EB0CC" }
active = { fg = "#B281EB", bold = true }
inactive = {}

[input]
border = { fg = "#4EB0CC" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#4EB0CC" }

[tasks]
border = { fg = "#4EB0CC" }
title = {}
hovered = { fg = "#B281EB", bold = true }

[which]
border = { fg = "#4EB0CC" }
cand = { fg = "#6BDFFF" }
rest = { fg = "#7F8C98" }
desc = { fg = "#B281EB" }
separator = "  "
separator_style = { fg = "#53606E" }

[help]
on = { fg = "#6BDFFF" }
run = { fg = "#B281EB" }
hovered = { reversed = true, bold = true }
footer = { fg = "#292A30", bg = "#DFDFE0" }

[spot]
border = { fg = "#4EB0CC" }
title = { fg = "#4EB0CC" }
tbl_col = { fg = "#6BDFFF" }
tbl_cell = { fg = "#B281EB", bg = "#414453" }

[notify]
title_info = { fg = "#84B360" }
title_warn = { fg = "#D9C97C" }
title_error = { fg = "#FF8170" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#78C2B3" },
  { mime = "**/{audio,video}/*", fg = "#D9C97C" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B281EB" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#84B360" },
  { mime = "vfs/{absent,stale}", fg = "#7F8C98" },
  { url = "*", fg = "#DFDFE0" },
  { url = "*/", fg = "#4EB0CC" },
]
