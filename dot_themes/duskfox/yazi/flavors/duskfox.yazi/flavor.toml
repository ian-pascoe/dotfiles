# Duskfox local Yazi flavor

[mgr]
cwd = { fg = "#569fba" }
find_keyword = { fg = "#f6c177", bold = true, italic = true }
find_position = { fg = "#c4a7e7", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#eb6f92", bg = "#eb6f92" }
marker_marked = { fg = "#9ccfd8", bg = "#9ccfd8" }
marker_selected = { fg = "#f6c177", bg = "#f6c177" }
count_copied = { fg = "#232136", bg = "#a3be8c" }
count_cut = { fg = "#232136", bg = "#eb6f92" }
count_selected = { fg = "#232136", bg = "#f6c177" }
border_symbol = "│"
border_style = { fg = "#6e6a86" }

[tabs]
active = { fg = "#232136", bg = "#569fba", bold = true }
inactive = { fg = "#569fba", bg = "#2d2a45" }

[mode]
normal_main = { fg = "#232136", bg = "#569fba", bold = true }
normal_alt = { fg = "#569fba", bg = "#2d2a45" }
select_main = { fg = "#232136", bg = "#a3be8c", bold = true }
select_alt = { fg = "#a3be8c", bg = "#2d2a45" }
unset_main = { fg = "#232136", bg = "#c4a7e7", bold = true }
unset_alt = { fg = "#c4a7e7", bg = "#2d2a45" }

[status]
perm_sep = { fg = "#6e6a86" }
perm_type = { fg = "#569fba" }
perm_read = { fg = "#a3be8c" }
perm_write = { fg = "#f6c177" }
perm_exec = { fg = "#eb6f92" }
progress_label = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#a3be8c", bg = "#373354" }
progress_error = { fg = "#f6c177", bg = "#eb6f92" }

[pick]
border = { fg = "#569fba" }
active = { fg = "#c4a7e7", bold = true }
inactive = {}

[input]
border = { fg = "#569fba" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#569fba" }

[tasks]
border = { fg = "#569fba" }
title = {}
hovered = { fg = "#c4a7e7", bold = true }

[which]
border = { fg = "#569fba" }
cand = { fg = "#9ccfd8" }
rest = { fg = "#817c9c" }
desc = { fg = "#c4a7e7" }
separator = "  "
separator_style = { fg = "#6e6a86" }

[help]
on = { fg = "#9ccfd8" }
run = { fg = "#c4a7e7" }
hovered = { reversed = true, bold = true }
footer = { fg = "#232136", bg = "#e0def4" }

[spot]
border = { fg = "#569fba" }
title = { fg = "#569fba" }
tbl_col = { fg = "#9ccfd8" }
tbl_cell = { fg = "#c4a7e7", bg = "#373354" }

[notify]
title_info = { fg = "#a3be8c" }
title_warn = { fg = "#f6c177" }
title_error = { fg = "#eb6f92" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#9ccfd8" },
  { mime = "**/{audio,video}/*", fg = "#f6c177" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c4a7e7" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#a3be8c" },
  { mime = "vfs/{absent,stale}", fg = "#817c9c" },
  { url = "*", fg = "#e0def4" },
  { url = "*/", fg = "#569fba" },
]
