# Eldritch local Yazi flavor

[mgr]
cwd = { fg = "#a48cf2" }
find_keyword = { fg = "#f1fc79", bold = true, italic = true }
find_position = { fg = "#f265b5", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#37f499", bg = "#37f499" }
marker_cut = { fg = "#f16c75", bg = "#f16c75" }
marker_marked = { fg = "#04d1f9", bg = "#04d1f9" }
marker_selected = { fg = "#f1fc79", bg = "#f1fc79" }
count_copied = { fg = "#212337", bg = "#37f499" }
count_cut = { fg = "#212337", bg = "#f16c75" }
count_selected = { fg = "#212337", bg = "#f1fc79" }
border_symbol = "│"
border_style = { fg = "#414868" }

[tabs]
active = { fg = "#212337", bg = "#a48cf2", bold = true }
inactive = { fg = "#a48cf2", bg = "#292e42" }

[mode]
normal_main = { fg = "#212337", bg = "#a48cf2", bold = true }
normal_alt = { fg = "#a48cf2", bg = "#292e42" }
select_main = { fg = "#212337", bg = "#37f499", bold = true }
select_alt = { fg = "#37f499", bg = "#292e42" }
unset_main = { fg = "#212337", bg = "#f265b5", bold = true }
unset_alt = { fg = "#f265b5", bg = "#292e42" }

[status]
perm_sep = { fg = "#414868" }
perm_type = { fg = "#a48cf2" }
perm_read = { fg = "#37f499" }
perm_write = { fg = "#f1fc79" }
perm_exec = { fg = "#f16c75" }
progress_label = { fg = "#ebfafa", bold = true }
progress_normal = { fg = "#37f499", bg = "#323449" }
progress_error = { fg = "#f1fc79", bg = "#f16c75" }

[pick]
border = { fg = "#a48cf2" }
active = { fg = "#f265b5", bold = true }
inactive = {}

[input]
border = { fg = "#a48cf2" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#a48cf2" }

[tasks]
border = { fg = "#a48cf2" }
title = {}
hovered = { fg = "#f265b5", bold = true }

[which]
border = { fg = "#a48cf2" }
cand = { fg = "#04d1f9" }
rest = { fg = "#7081d0" }
desc = { fg = "#f265b5" }
separator = "  "
separator_style = { fg = "#414868" }

[help]
on = { fg = "#04d1f9" }
run = { fg = "#f265b5" }
hovered = { reversed = true, bold = true }
footer = { fg = "#212337", bg = "#ebfafa" }

[spot]
border = { fg = "#a48cf2" }
title = { fg = "#a48cf2" }
tbl_col = { fg = "#04d1f9" }
tbl_cell = { fg = "#f265b5", bg = "#323449" }

[notify]
title_info = { fg = "#37f499" }
title_warn = { fg = "#f1fc79" }
title_error = { fg = "#f16c75" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#66e4fd" },
  { mime = "**/{audio,video}/*", fg = "#f1fc79" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f265b5" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#37f499" },
  { mime = "vfs/{absent,stale}", fg = "#7081d0" },
  { url = "*", fg = "#ebfafa" },
  { url = "*/", fg = "#a48cf2" },
]
