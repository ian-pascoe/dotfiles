# Retro 82 local Yazi flavor

[mgr]
cwd = { fg = "#faa968" }
find_keyword = { fg = "#e97b3c", bold = true, italic = true }
find_position = { fg = "#5aa6a1", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#19a7a8", bg = "#19a7a8" }
marker_cut = { fg = "#f85525", bg = "#f85525" }
marker_marked = { fg = "#63c6be", bg = "#63c6be" }
marker_selected = { fg = "#e97b3c", bg = "#e97b3c" }
count_copied = { fg = "#05182e", bg = "#19a7a8" }
count_cut = { fg = "#05182e", bg = "#f85525" }
count_selected = { fg = "#05182e", bg = "#e97b3c" }
border_symbol = "│"
border_style = { fg = "#134e5a" }

[tabs]
active = { fg = "#05182e", bg = "#faa968", bold = true }
inactive = { fg = "#faa968", bg = "#0a2540" }

[mode]
normal_main = { fg = "#05182e", bg = "#faa968", bold = true }
normal_alt = { fg = "#faa968", bg = "#0a2540" }
select_main = { fg = "#05182e", bg = "#19a7a8", bold = true }
select_alt = { fg = "#19a7a8", bg = "#0a2540" }
unset_main = { fg = "#05182e", bg = "#5aa6a1", bold = true }
unset_alt = { fg = "#5aa6a1", bg = "#0a2540" }

[status]
perm_sep = { fg = "#134e5a" }
perm_type = { fg = "#faa968" }
perm_read = { fg = "#19a7a8" }
perm_write = { fg = "#e97b3c" }
perm_exec = { fg = "#f85525" }
progress_label = { fg = "#f6dcac", bold = true }
progress_normal = { fg = "#19a7a8", bg = "#134e5a" }
progress_error = { fg = "#e97b3c", bg = "#f85525" }

[pick]
border = { fg = "#faa968" }
active = { fg = "#5aa6a1", bold = true }
inactive = {}

[input]
border = { fg = "#faa968" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#faa968" }

[tasks]
border = { fg = "#faa968" }
title = {}
hovered = { fg = "#5aa6a1", bold = true }

[which]
border = { fg = "#faa968" }
cand = { fg = "#63c6be" }
rest = { fg = "#5f8f96" }
desc = { fg = "#5aa6a1" }
separator = "  "
separator_style = { fg = "#134e5a" }

[help]
on = { fg = "#63c6be" }
run = { fg = "#5aa6a1" }
hovered = { reversed = true, bold = true }
footer = { fg = "#05182e", bg = "#f6dcac" }

[spot]
border = { fg = "#faa968" }
title = { fg = "#faa968" }
tbl_col = { fg = "#63c6be" }
tbl_cell = { fg = "#5aa6a1", bg = "#134e5a" }

[notify]
title_info = { fg = "#19a7a8" }
title_warn = { fg = "#e97b3c" }
title_error = { fg = "#f85525" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8cbfb8" },
  { mime = "**/{audio,video}/*", fg = "#e97b3c" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#5aa6a1" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#19a7a8" },
  { mime = "vfs/{absent,stale}", fg = "#5f8f96" },
  { url = "*", fg = "#f6dcac" },
  { url = "*/", fg = "#faa968" },
]
