# VS Code Dark Modern local Yazi flavor

[mgr]
cwd = { fg = "#3794ff" }
find_keyword = { fg = "#cca700", bold = true, italic = true }
find_position = { fg = "#c586c0", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#2ea043", bg = "#2ea043" }
marker_cut = { fg = "#f14c4c", bg = "#f14c4c" }
marker_marked = { fg = "#4ec9b0", bg = "#4ec9b0" }
marker_selected = { fg = "#cca700", bg = "#cca700" }
count_copied = { fg = "#1f1f1f", bg = "#2ea043" }
count_cut = { fg = "#1f1f1f", bg = "#f14c4c" }
count_selected = { fg = "#1f1f1f", bg = "#cca700" }
border_symbol = "│"
border_style = { fg = "#3c3c3c" }

[tabs]
active = { fg = "#1f1f1f", bg = "#3794ff", bold = true }
inactive = { fg = "#3794ff", bg = "#2a2d2e" }

[mode]
normal_main = { fg = "#1f1f1f", bg = "#3794ff", bold = true }
normal_alt = { fg = "#3794ff", bg = "#2a2d2e" }
select_main = { fg = "#1f1f1f", bg = "#2ea043", bold = true }
select_alt = { fg = "#2ea043", bg = "#2a2d2e" }
unset_main = { fg = "#1f1f1f", bg = "#c586c0", bold = true }
unset_alt = { fg = "#c586c0", bg = "#2a2d2e" }

[status]
perm_sep = { fg = "#3c3c3c" }
perm_type = { fg = "#3794ff" }
perm_read = { fg = "#2ea043" }
perm_write = { fg = "#cca700" }
perm_exec = { fg = "#f14c4c" }
progress_label = { fg = "#cccccc", bold = true }
progress_normal = { fg = "#2ea043", bg = "#37373d" }
progress_error = { fg = "#cca700", bg = "#f14c4c" }

[pick]
border = { fg = "#3794ff" }
active = { fg = "#c586c0", bold = true }
inactive = {}

[input]
border = { fg = "#3794ff" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#3794ff" }

[tasks]
border = { fg = "#3794ff" }
title = {}
hovered = { fg = "#c586c0", bold = true }

[which]
border = { fg = "#3794ff" }
cand = { fg = "#4ec9b0" }
rest = { fg = "#9d9d9d" }
desc = { fg = "#c586c0" }
separator = "  "
separator_style = { fg = "#3c3c3c" }

[help]
on = { fg = "#4ec9b0" }
run = { fg = "#c586c0" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1f1f1f", bg = "#cccccc" }

[spot]
border = { fg = "#3794ff" }
title = { fg = "#3794ff" }
tbl_col = { fg = "#4ec9b0" }
tbl_cell = { fg = "#c586c0", bg = "#37373d" }

[notify]
title_info = { fg = "#2ea043" }
title_warn = { fg = "#cca700" }
title_error = { fg = "#f14c4c" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#4ec9b0" },
  { mime = "**/{audio,video}/*", fg = "#cca700" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c586c0" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#2ea043" },
  { mime = "vfs/{absent,stale}", fg = "#9d9d9d" },
  { url = "*", fg = "#cccccc" },
  { url = "*/", fg = "#3794ff" },
]
