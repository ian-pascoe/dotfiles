# Kanagawa Paper local Yazi flavor

[mgr]
cwd = { fg = "#859fac" }
find_keyword = { fg = "#c4b28a", bold = true, italic = true }
find_position = { fg = "#a292a3", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#699469", bg = "#699469" }
marker_cut = { fg = "#c4746e", bg = "#c4746e" }
marker_marked = { fg = "#6a9589", bg = "#6a9589" }
marker_selected = { fg = "#c4b28a", bg = "#c4b28a" }
count_copied = { fg = "#1f1f28", bg = "#699469" }
count_cut = { fg = "#1f1f28", bg = "#c4746e" }
count_selected = { fg = "#1f1f28", bg = "#c4b28a" }
border_symbol = "│"
border_style = { fg = "#54546d" }

[tabs]
active = { fg = "#1f1f28", bg = "#859fac", bold = true }
inactive = { fg = "#859fac", bg = "#2a2a37" }

[mode]
normal_main = { fg = "#1f1f28", bg = "#859fac", bold = true }
normal_alt = { fg = "#859fac", bg = "#2a2a37" }
select_main = { fg = "#1f1f28", bg = "#699469", bold = true }
select_alt = { fg = "#699469", bg = "#2a2a37" }
unset_main = { fg = "#1f1f28", bg = "#a292a3", bold = true }
unset_alt = { fg = "#a292a3", bg = "#2a2a37" }

[status]
perm_sep = { fg = "#54546d" }
perm_type = { fg = "#859fac" }
perm_read = { fg = "#699469" }
perm_write = { fg = "#c4b28a" }
perm_exec = { fg = "#c4746e" }
progress_label = { fg = "#dcd7ba", bold = true }
progress_normal = { fg = "#699469", bg = "#363646" }
progress_error = { fg = "#c4b28a", bg = "#c4746e" }

[pick]
border = { fg = "#859fac" }
active = { fg = "#a292a3", bold = true }
inactive = {}

[input]
border = { fg = "#859fac" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#859fac" }

[tasks]
border = { fg = "#859fac" }
title = {}
hovered = { fg = "#a292a3", bold = true }

[which]
border = { fg = "#859fac" }
cand = { fg = "#6a9589" }
rest = { fg = "#727169" }
desc = { fg = "#a292a3" }
separator = "  "
separator_style = { fg = "#54546d" }

[help]
on = { fg = "#6a9589" }
run = { fg = "#a292a3" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1f1f28", bg = "#dcd7ba" }

[spot]
border = { fg = "#859fac" }
title = { fg = "#859fac" }
tbl_col = { fg = "#6a9589" }
tbl_cell = { fg = "#a292a3", bg = "#363646" }

[notify]
title_info = { fg = "#699469" }
title_warn = { fg = "#c4b28a" }
title_error = { fg = "#c4746e" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8ea49e" },
  { mime = "**/{audio,video}/*", fg = "#c4b28a" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a292a3" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#699469" },
  { mime = "vfs/{absent,stale}", fg = "#727169" },
  { url = "*", fg = "#dcd7ba" },
  { url = "*/", fg = "#859fac" },
]
