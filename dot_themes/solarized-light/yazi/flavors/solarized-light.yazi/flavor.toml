# Hand-derived from the altercation/solarized "light" palette.
# Solarized Light local Yazi flavor

[mgr]
cwd = { fg = "#268bd2" }
find_keyword = { fg = "#b58900", bold = true, italic = true }
find_position = { fg = "#6c71c4", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#859900", bg = "#859900" }
marker_cut = { fg = "#dc322f", bg = "#dc322f" }
marker_marked = { fg = "#2aa198", bg = "#2aa198" }
marker_selected = { fg = "#b58900", bg = "#b58900" }
count_copied = { fg = "#fdf6e3", bg = "#859900" }
count_cut = { fg = "#fdf6e3", bg = "#dc322f" }
count_selected = { fg = "#fdf6e3", bg = "#b58900" }
border_symbol = "│"
border_style = { fg = "#93a1a1" }

[tabs]
active = { fg = "#fdf6e3", bg = "#268bd2", bold = true }
inactive = { fg = "#268bd2", bg = "#eee8d5" }

[mode]
normal_main = { fg = "#fdf6e3", bg = "#268bd2", bold = true }
normal_alt = { fg = "#268bd2", bg = "#eee8d5" }
select_main = { fg = "#fdf6e3", bg = "#2aa198", bold = true }
select_alt = { fg = "#2aa198", bg = "#eee8d5" }
unset_main = { fg = "#fdf6e3", bg = "#6c71c4", bold = true }
unset_alt = { fg = "#6c71c4", bg = "#eee8d5" }

[status]
perm_sep = { fg = "#93a1a1" }
perm_type = { fg = "#268bd2" }
perm_read = { fg = "#859900" }
perm_write = { fg = "#b58900" }
perm_exec = { fg = "#dc322f" }
progress_label = { fg = "#657b83", bold = true }
progress_normal = { fg = "#859900", bg = "#e6dfca" }
progress_error = { fg = "#b58900", bg = "#dc322f" }

[pick]
border = { fg = "#268bd2" }
active = { fg = "#6c71c4", bold = true }
inactive = {}

[input]
border = { fg = "#268bd2" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#268bd2" }

[tasks]
border = { fg = "#268bd2" }
title = {}
hovered = { fg = "#6c71c4", bold = true }

[which]
border = { fg = "#268bd2" }
cand = { fg = "#2aa198" }
rest = { fg = "#839496" }
desc = { fg = "#6c71c4" }
separator = "  "
separator_style = { fg = "#93a1a1" }

[help]
on = { fg = "#2aa198" }
run = { fg = "#6c71c4" }
hovered = { reversed = true, bold = true }
footer = { fg = "#fdf6e3", bg = "#657b83" }

[spot]
border = { fg = "#268bd2" }
title = { fg = "#268bd2" }
tbl_col = { fg = "#2aa198" }
tbl_cell = { fg = "#6c71c4", bg = "#e6dfca" }

[notify]
title_info = { fg = "#859900" }
title_warn = { fg = "#b58900" }
title_error = { fg = "#dc322f" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#2aa198" },
  { mime = "**/{audio,video}/*", fg = "#b58900" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#6c71c4" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#859900" },
  { mime = "vfs/{absent,stale}", fg = "#839496" },
  { url = "*", fg = "#657b83" },
  { url = "*/", fg = "#268bd2" },
]

