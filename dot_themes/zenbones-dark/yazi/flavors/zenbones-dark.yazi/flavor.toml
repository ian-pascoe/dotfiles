# Zenbones Dark local Yazi flavor

[mgr]
cwd = { fg = "#6099C0" }
find_keyword = { fg = "#B77E64", bold = true, italic = true }
find_position = { fg = "#B279A7", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#819B69", bg = "#819B69" }
marker_cut = { fg = "#DE6E7C", bg = "#DE6E7C" }
marker_marked = { fg = "#65B8C1", bg = "#65B8C1" }
marker_selected = { fg = "#B77E64", bg = "#B77E64" }
count_copied = { fg = "#1C1917", bg = "#819B69" }
count_cut = { fg = "#1C1917", bg = "#DE6E7C" }
count_selected = { fg = "#1C1917", bg = "#B77E64" }
border_symbol = "│"
border_style = { fg = "#5C534F" }

[tabs]
active = { fg = "#1C1917", bg = "#6099C0", bold = true }
inactive = { fg = "#6099C0", bg = "#25211F" }

[mode]
normal_main = { fg = "#1C1917", bg = "#6099C0", bold = true }
normal_alt = { fg = "#6099C0", bg = "#25211F" }
select_main = { fg = "#1C1917", bg = "#819B69", bold = true }
select_alt = { fg = "#819B69", bg = "#25211F" }
unset_main = { fg = "#1C1917", bg = "#B279A7", bold = true }
unset_alt = { fg = "#B279A7", bg = "#25211F" }

[status]
perm_sep = { fg = "#5C534F" }
perm_type = { fg = "#6099C0" }
perm_read = { fg = "#819B69" }
perm_write = { fg = "#B77E64" }
perm_exec = { fg = "#DE6E7C" }
progress_label = { fg = "#B4BDC3", bold = true }
progress_normal = { fg = "#819B69", bg = "#3D4042" }
progress_error = { fg = "#1C1917", bg = "#DE6E7C" }

[pick]
border = { fg = "#6099C0" }
active = { fg = "#B279A7", bold = true }
inactive = {}

[input]
border = { fg = "#6099C0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#6099C0" }

[tasks]
border = { fg = "#6099C0" }
title = {}
hovered = { fg = "#B279A7", bold = true }

[which]
border = { fg = "#6099C0" }
cand = { fg = "#65B8C1" }
rest = { fg = "#837771" }
desc = { fg = "#B279A7" }
separator = "  "
separator_style = { fg = "#5C534F" }

[help]
on = { fg = "#65B8C1" }
run = { fg = "#B279A7" }
hovered = { reversed = true, bold = true }
footer = { fg = "#1C1917", bg = "#B4BDC3" }

[spot]
border = { fg = "#6099C0" }
title = { fg = "#6099C0" }
tbl_col = { fg = "#65B8C1" }
tbl_cell = { fg = "#B279A7", bg = "#3D4042" }

[notify]
title_info = { fg = "#819B69" }
title_warn = { fg = "#B77E64" }
title_error = { fg = "#DE6E7C" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#66A5AD" },
  { mime = "**/{audio,video}/*", fg = "#B77E64" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B279A7" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#819B69" },
  { mime = "vfs/{absent,stale}", fg = "#837771" },
  { url = "*", fg = "#B4BDC3" },
  { url = "*/", fg = "#6099C0" },
]
