# Hand-mapped from Material Theme "Ocean" (VS Code, equinusocio.vsc-material-theme) palette as ported by marko-cerovac/material.nvim "deep ocean" (92f7366); terminal colors from Ghostty's bundled "Material Ocean" theme.
k9s:
