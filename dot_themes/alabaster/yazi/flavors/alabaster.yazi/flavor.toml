# Alabaster local Yazi flavor

[mgr]
cwd = { fg = "#325CC0" }
find_keyword = { fg = "#BC7500", bold = true, italic = true }
find_position = { fg = "#7A3E9D", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#448C27", bg = "#448C27" }
marker_cut = { fg = "#AA3731", bg = "#AA3731" }
marker_marked = { fg = "#007ACC", bg = "#007ACC" }
marker_selected = { fg = "#BC7500", bg = "#BC7500" }
count_copied = { fg = "#F7F7F7", bg = "#448C27" }
count_cut = { fg = "#F7F7F7", bg = "#AA3731" }
count_selected = { fg = "#F7F7F7", bg = "#BC7500" }
border_symbol = "│"
border_style = { fg = "#B7B7B7" }

[tabs]
active = { fg = "#F7F7F7", bg = "#325CC0", bold = true }
inactive = { fg = "#325CC0", bg = "#E7E7E7" }

[mode]
normal_main = { fg = "#F7F7F7", bg = "#325CC0", bold = true }
normal_alt = { fg = "#325CC0", bg = "#E7E7E7" }
select_main = { fg = "#F7F7F7", bg = "#448C27", bold = true }
select_alt = { fg = "#448C27", bg = "#E7E7E7" }
unset_main = { fg = "#F7F7F7", bg = "#7A3E9D", bold = true }
unset_alt = { fg = "#7A3E9D", bg = "#E7E7E7" }

[status]
perm_sep = { fg = "#B7B7B7" }
perm_type = { fg = "#325CC0" }
perm_read = { fg = "#448C27" }
perm_write = { fg = "#BC7500" }
perm_exec = { fg = "#AA3731" }
progress_label = { fg = "#000000", bold = true }
progress_normal = { fg = "#448C27", bg = "#BFDBFE" }
progress_error = { fg = "#F7F7F7", bg = "#AA3731" }

[pick]
border = { fg = "#325CC0" }
active = { fg = "#7A3E9D", bold = true }
inactive = {}

[input]
border = { fg = "#325CC0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#325CC0" }

[tasks]
border = { fg = "#325CC0" }
title = {}
hovered = { fg = "#7A3E9D", bold = true }

[which]
border = { fg = "#325CC0" }
cand = { fg = "#007ACC" }
rest = { fg = "#777777" }
desc = { fg = "#7A3E9D" }
separator = "  "
separator_style = { fg = "#B7B7B7" }

[help]
on = { fg = "#007ACC" }
run = { fg = "#7A3E9D" }
hovered = { reversed = true, bold = true }
footer = { fg = "#F7F7F7", bg = "#000000" }

[spot]
border = { fg = "#325CC0" }
title = { fg = "#325CC0" }
tbl_col = { fg = "#007ACC" }
tbl_cell = { fg = "#7A3E9D", bg = "#BFDBFE" }

[notify]
title_info = { fg = "#448C27" }
title_warn = { fg = "#BC7500" }
title_error = { fg = "#AA3731" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#0083B2" },
  { mime = "**/{audio,video}/*", fg = "#BC7500" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#7A3E9D" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#448C27" },
  { mime = "vfs/{absent,stale}", fg = "#777777" },
  { url = "*", fg = "#000000" },
  { url = "*/", fg = "#325CC0" },
]
