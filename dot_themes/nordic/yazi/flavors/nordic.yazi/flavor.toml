# Nordic local Yazi flavor

[mgr]
cwd = { fg = "#88c0d0" }
find_keyword = { fg = "#ebcb8b", bold = true, italic = true }
find_position = { fg = "#b48ead", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut = { fg = "#c5727a", bg = "#c5727a" }
marker_marked = { fg = "#81a1c1", bg = "#81a1c1" }
marker_selected = { fg = "#ebcb8b", bg = "#ebcb8b" }
count_copied = { fg = "#242933", bg = "#a3be8c" }
count_cut = { fg = "#242933", bg = "#c5727a" }
count_selected = { fg = "#242933", bg = "#ebcb8b" }
border_symbol = "│"
border_style = { fg = "#4c566a" }

[tabs]
active = { fg = "#242933", bg = "#88c0d0", bold = true }
inactive = { fg = "#88c0d0", bg = "#2e3440" }

[mode]
normal_main = { fg = "#242933", bg = "#88c0d0", bold = true }
normal_alt = { fg = "#88c0d0", bg = "#2e3440" }
select_main = { fg = "#242933", bg = "#a3be8c", bold = true }
select_alt = { fg = "#a3be8c", bg = "#2e3440" }
unset_main = { fg = "#242933", bg = "#b48ead", bold = true }
unset_alt = { fg = "#b48ead", bg = "#2e3440" }

[status]
perm_sep = { fg = "#4c566a" }
perm_type = { fg = "#88c0d0" }
perm_read = { fg = "#a3be8c" }
perm_write = { fg = "#ebcb8b" }
perm_exec = { fg = "#c5727a" }
progress_label = { fg = "#c0c8d8", bold = true }
progress_normal = { fg = "#a3be8c", bg = "#3b4252" }
progress_error = { fg = "#ebcb8b", bg = "#c5727a" }

[pick]
border = { fg = "#88c0d0" }
active = { fg = "#b48ead", bold = true }
inactive = {}

[input]
border = { fg = "#88c0d0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#88c0d0" }

[tasks]
border = { fg = "#88c0d0" }
title = {}
hovered = { fg = "#b48ead", bold = true }

[which]
border = { fg = "#88c0d0" }
cand = { fg = "#81a1c1" }
rest = { fg = "#60728a" }
desc = { fg = "#b48ead" }
separator = "  "
separator_style = { fg = "#4c566a" }

[help]
on = { fg = "#81a1c1" }
run = { fg = "#b48ead" }
hovered = { reversed = true, bold = true }
footer = { fg = "#242933", bg = "#c0c8d8" }

[spot]
border = { fg = "#88c0d0" }
title = { fg = "#88c0d0" }
tbl_col = { fg = "#81a1c1" }
tbl_cell = { fg = "#b48ead", bg = "#3b4252" }

[notify]
title_info = { fg = "#a3be8c" }
title_warn = { fg = "#ebcb8b" }
title_error = { fg = "#c5727a" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8fbcbb" },
  { mime = "**/{audio,video}/*", fg = "#ebcb8b" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#b48ead" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#a3be8c" },
  { mime = "vfs/{absent,stale}", fg = "#60728a" },
  { url = "*", fg = "#c0c8d8" },
  { url = "*/", fg = "#88c0d0" },
]
