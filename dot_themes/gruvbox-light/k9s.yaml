# Hand-derived from the ellisonleao/gruvbox.nvim "light" (medium contrast) palette.
k9s:
  body:
    fgColor: "#3c3836"
    bgColor: default
    logoColor: "#076678"
  prompt:
    fgColor: "#3c3836"
    bgColor: default
    suggestColor: "#076678"
  help:
    fgColor: "#3c3836"
    bgColor: default
    sectionColor: "#79740e"
    keyColor: "#076678"
    numKeyColor: "#9d0006"
  frame:
    title:
      fgColor: "#427b58"
      bgColor: default
      highlightColor: "#8f3f71"
      counterColor: "#b57614"
      filterColor: "#79740e"
    border:
      fgColor: "#076678"
      focusColor: "#427b58"
    menu:
      fgColor: "#3c3836"
      keyColor: "#076678"
      numKeyColor: "#9d0006"
    crumbs:
      fgColor: "#fbf1c7"
      bgColor: default
      activeColor: "#b57614"
    status:
      newColor: "#076678"
      modifyColor: "#427b58"
      addColor: "#79740e"
      pendingColor: "#af3a03"
      errorColor: "#9d0006"
      highlightColor: "#427b58"
      killColor: "#8f3f71"
      completedColor: "#7c6f64"
  info:
    fgColor: "#af3a03"
    sectionColor: "#3c3836"
  views:
    table:
      fgColor: "#3c3836"
      bgColor: default
      cursorFgColor: "#fbf1c7"
      cursorBgColor: "#d5c4a1"
      markColor: "#427b58"
      header:
        fgColor: "#b57614"
        bgColor: default
        sorterColor: "#427b58"
    xray:
      fgColor: "#3c3836"
      bgColor: default
      cursorColor: "#d5c4a1"
      cursorTextColor: "#3c3836"
      graphicColor: "#8f3f71"
    charts:
      bgColor: default
      chartBgColor: default
      dialBgColor: default
      defaultDialColors:
        - "#79740e"
        - "#9d0006"
      defaultChartColors:
        - "#79740e"
        - "#9d0006"
      resourceColors:
        cpu:
          - "#076678"
          - "#427b58"
        mem:
          - "#79740e"
          - "#b57614"
    yaml:
      keyColor: "#076678"
      valueColor: "#3c3836"
      colonColor: "#7c6f64"
    logs:
      fgColor: "#3c3836"
      bgColor: default
      indicator:
        fgColor: "#427b58"
        bgColor: default
        toggleOnColor: "#79740e"
        toggleOffColor: "#7c6f64"
  dialog:
    fgColor: "#b57614"
    bgColor: default
    buttonFgColor: "#fbf1c7"
    buttonBgColor: "#7c6f64"
    buttonFocusFgColor: "#fbf1c7"
    buttonFocusBgColor: "#8f3f71"
    labelFgColor: "#af3a03"
    fieldFgColor: "#3c3836"
