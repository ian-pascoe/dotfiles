# Xcode Light local Yazi flavor

[mgr]
cwd = { fg = "#0F68A0" }
find_keyword = { fg = "#78492A", bold = true, italic = true }
find_position = { fg = "#804FB8", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#2D8504", bg = "#2D8504" }
marker_cut = { fg = "#D12F1B", bg = "#D12F1B" }
marker_marked = { fg = "#156ADF", bg = "#156ADF" }
marker_selected = { fg = "#78492A", bg = "#78492A" }
count_copied = { fg = "#FFFFFF", bg = "#2D8504" }
count_cut = { fg = "#FFFFFF", bg = "#D12F1B" }
count_selected = { fg = "#FFFFFF", bg = "#78492A" }
border_symbol = "│"
border_style = { fg = "#CDCDCD" }

[tabs]
active = { fg = "#FFFFFF", bg = "#0F68A0", bold = true }
inactive = { fg = "#0F68A0", bg = "#F4F4F4" }

[mode]
normal_main = { fg = "#FFFFFF", bg = "#0F68A0", bold = true }
normal_alt = { fg = "#0F68A0", bg = "#F4F4F4" }
select_main = { fg = "#FFFFFF", bg = "#2D8504", bold = true }
select_alt = { fg = "#2D8504", bg = "#F4F4F4" }
unset_main = { fg = "#FFFFFF", bg = "#804FB8", bold = true }
unset_alt = { fg = "#804FB8", bg = "#F4F4F4" }

[status]
perm_sep = { fg = "#CDCDCD" }
perm_type = { fg = "#0F68A0" }
perm_read = { fg = "#2D8504" }
perm_write = { fg = "#78492A" }
perm_exec = { fg = "#D12F1B" }
progress_label = { fg = "#262626", bold = true }
progress_normal = { fg = "#2D8504", bg = "#B4D8FD" }
progress_error = { fg = "#FFFFFF", bg = "#D12F1B" }

[pick]
border = { fg = "#0F68A0" }
active = { fg = "#804FB8", bold = true }
inactive = {}

[input]
border = { fg = "#0F68A0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#0F68A0" }

[tasks]
border = { fg = "#0F68A0" }
title = {}
hovered = { fg = "#804FB8", bold = true }

[which]
border = { fg = "#0F68A0" }
cand = { fg = "#156ADF" }
rest = { fg = "#5C6873" }
desc = { fg = "#804FB8" }
separator = "  "
separator_style = { fg = "#CDCDCD" }

[help]
on = { fg = "#156ADF" }
run = { fg = "#804FB8" }
hovered = { reversed = true, bold = true }
footer = { fg = "#FFFFFF", bg = "#262626" }

[spot]
border = { fg = "#0F68A0" }
title = { fg = "#0F68A0" }
tbl_col = { fg = "#156ADF" }
tbl_cell = { fg = "#804FB8", bg = "#B4D8FD" }

[notify]
title_info = { fg = "#2D8504" }
title_warn = { fg = "#78492A" }
title_error = { fg = "#D12F1B" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#3E8087" },
  { mime = "**/{audio,video}/*", fg = "#78492A" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#804FB8" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#2D8504" },
  { mime = "vfs/{absent,stale}", fg = "#5C6873" },
  { url = "*", fg = "#262626" },
  { url = "*/", fg = "#0F68A0" },
]
