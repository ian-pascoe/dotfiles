# One Light local Yazi flavor

[mgr]
cwd = { fg = "#4078f2" }
find_keyword = { fg = "#986801", bold = true, italic = true }
find_position = { fg = "#a626a4", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#50a14f", bg = "#50a14f" }
marker_cut = { fg = "#e45649", bg = "#e45649" }
marker_marked = { fg = "#0184bc", bg = "#0184bc" }
marker_selected = { fg = "#986801", bg = "#986801" }
count_copied = { fg = "#fafafa", bg = "#50a14f" }
count_cut = { fg = "#fafafa", bg = "#e45649" }
count_selected = { fg = "#fafafa", bg = "#986801" }
border_symbol = "│"
border_style = { fg = "#a0a1a7" }

[tabs]
active = { fg = "#fafafa", bg = "#4078f2", bold = true }
inactive = { fg = "#4078f2", bg = "#f0f0f0" }

[mode]
normal_main = { fg = "#fafafa", bg = "#4078f2", bold = true }
normal_alt = { fg = "#4078f2", bg = "#f0f0f0" }
select_main = { fg = "#fafafa", bg = "#0184bc", bold = true }
select_alt = { fg = "#0184bc", bg = "#f0f0f0" }
unset_main = { fg = "#fafafa", bg = "#a626a4", bold = true }
unset_alt = { fg = "#a626a4", bg = "#f0f0f0" }

[status]
perm_sep = { fg = "#a0a1a7" }
perm_type = { fg = "#4078f2" }
perm_read = { fg = "#50a14f" }
perm_write = { fg = "#986801" }
perm_exec = { fg = "#e45649" }
progress_label = { fg = "#383a42", bold = true }
progress_normal = { fg = "#50a14f", bg = "#dcdcdc" }
progress_error = { fg = "#986801", bg = "#e45649" }

[pick]
border = { fg = "#4078f2" }
active = { fg = "#a626a4", bold = true }
inactive = {}

[input]
border = { fg = "#4078f2" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#4078f2" }

[tasks]
border = { fg = "#4078f2" }
title = {}
hovered = { fg = "#a626a4", bold = true }

[which]
border = { fg = "#4078f2" }
cand = { fg = "#0184bc" }
rest = { fg = "#818387" }
desc = { fg = "#a626a4" }
separator = "  "
separator_style = { fg = "#a0a1a7" }

[help]
on = { fg = "#0184bc" }
run = { fg = "#a626a4" }
hovered = { reversed = true, bold = true }
footer = { fg = "#fafafa", bg = "#383a42" }

[spot]
border = { fg = "#4078f2" }
title = { fg = "#4078f2" }
tbl_col = { fg = "#0184bc" }
tbl_cell = { fg = "#a626a4", bg = "#dcdcdc" }

[notify]
title_info = { fg = "#50a14f" }
title_warn = { fg = "#986801" }
title_error = { fg = "#e45649" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#0184bc" },
  { mime = "**/{audio,video}/*", fg = "#986801" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a626a4" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#50a14f" },
  { mime = "vfs/{absent,stale}", fg = "#818387" },
  { url = "*", fg = "#383a42" },
  { url = "*/", fg = "#4078f2" },
]

