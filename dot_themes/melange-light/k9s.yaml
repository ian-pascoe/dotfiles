      bgColor: default
      chartBgColor: default
      dialBgColor: default
      defaultDialColors:
        - "#3A684A"
        - "#BF0021"
      defaultChartColors:
        - "#3A684A"
        - "#BF0021"
      resourceColors:
        cpu:
          - "#465AA4"
          - "#3D6568"
        mem:
          - "#3A684A"
          - "#A06D00"
    yaml:
      keyColor: "#465AA4"
      valueColor: "#54433A"
      colonColor: "#A98A78"
    logs:
      fgColor: "#54433A"
      bgColor: default
      indicator:
        fgColor: "#3D6568"
        bgColor: default
        toggleOnColor: "#3A684A"
        toggleOffColor: "#A98A78"
  dialog:
    fgColor: "#A06D00"
    bgColor: default
    buttonFgColor: "#54433A"
    buttonBgColor: default
    buttonFocusFgColor: "#F1F1F1"
    buttonFocusBgColor: "#904180"
    labelFgColor: "#A06D00"
    fieldFgColor: "#54433A"
