# Vague local Yazi flavor

[mgr]
cwd = { fg = "#7e98e8" }
find_keyword = { fg = "#f3be7c", bold = true, italic = true }
find_position = { fg = "#bb9dbd", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#7fa563", bg = "#7fa563" }
marker_cut = { fg = "#d8647e", bg = "#d8647e" }
marker_marked = { fg = "#b4d4cf", bg = "#b4d4cf" }
marker_selected = { fg = "#f3be7c", bg = "#f3be7c" }
count_copied = { fg = "#141415", bg = "#7fa563" }
count_cut = { fg = "#141415", bg = "#d8647e" }
count_selected = { fg = "#141415", bg = "#f3be7c" }
border_symbol = "│"
border_style = { fg = "#333738" }

[tabs]
active = { fg = "#141415", bg = "#7e98e8", bold = true }
inactive = { fg = "#7e98e8", bg = "#1c1c24" }

[mode]
normal_main = { fg = "#141415", bg = "#7e98e8", bold = true }
normal_alt = { fg = "#7e98e8", bg = "#1c1c24" }
select_main = { fg = "#141415", bg = "#7fa563", bold = true }
select_alt = { fg = "#7fa563", bg = "#1c1c24" }
unset_main = { fg = "#141415", bg = "#bb9dbd", bold = true }
unset_alt = { fg = "#bb9dbd", bg = "#1c1c24" }

[status]
perm_sep = { fg = "#333738" }
perm_type = { fg = "#7e98e8" }
perm_read = { fg = "#7fa563" }
perm_write = { fg = "#f3be7c" }
perm_exec = { fg = "#d8647e" }
progress_label = { fg = "#cdcdcd", bold = true }
progress_normal = { fg = "#7fa563", bg = "#252530" }
progress_error = { fg = "#f3be7c", bg = "#d8647e" }

[pick]
border = { fg = "#7e98e8" }
active = { fg = "#bb9dbd", bold = true }
inactive = {}

[input]
border = { fg = "#7e98e8" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#7e98e8" }

[tasks]
border = { fg = "#7e98e8" }
title = {}
hovered = { fg = "#bb9dbd", bold = true }

[which]
border = { fg = "#7e98e8" }
cand = { fg = "#b4d4cf" }
rest = { fg = "#606079" }
desc = { fg = "#bb9dbd" }
separator = "  "
separator_style = { fg = "#333738" }

[help]
on = { fg = "#b4d4cf" }
run = { fg = "#bb9dbd" }
hovered = { reversed = true, bold = true }
footer = { fg = "#141415", bg = "#cdcdcd" }

[spot]
border = { fg = "#7e98e8" }
title = { fg = "#7e98e8" }
tbl_col = { fg = "#b4d4cf" }
tbl_cell = { fg = "#bb9dbd", bg = "#252530" }

[notify]
title_info = { fg = "#7fa563" }
title_warn = { fg = "#f3be7c" }
title_error = { fg = "#d8647e" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#b4d4cf" },
  { mime = "**/{audio,video}/*", fg = "#f3be7c" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bb9dbd" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#7fa563" },
  { mime = "vfs/{absent,stale}", fg = "#606079" },
  { url = "*", fg = "#cdcdcd" },
  { url = "*/", fg = "#7e98e8" },
]
