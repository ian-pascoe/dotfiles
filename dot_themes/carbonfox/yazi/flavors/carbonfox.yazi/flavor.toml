# Carbonfox local Yazi flavor

[mgr]
cwd = { fg = "#78a9ff" }
find_keyword = { fg = "#08bdba", bold = true, italic = true }
find_position = { fg = "#be95ff", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#25be6a", bg = "#25be6a" }
marker_cut = { fg = "#ee5396", bg = "#ee5396" }
marker_marked = { fg = "#33b1ff", bg = "#33b1ff" }
marker_selected = { fg = "#08bdba", bg = "#08bdba" }
count_copied = { fg = "#161616", bg = "#25be6a" }
count_cut = { fg = "#161616", bg = "#ee5396" }
count_selected = { fg = "#161616", bg = "#08bdba" }
border_symbol = "│"
border_style = { fg = "#535353" }

[tabs]
active = { fg = "#161616", bg = "#78a9ff", bold = true }
inactive = { fg = "#78a9ff", bg = "#252525" }

[mode]
normal_main = { fg = "#161616", bg = "#78a9ff", bold = true }
normal_alt = { fg = "#78a9ff", bg = "#252525" }
select_main = { fg = "#161616", bg = "#25be6a", bold = true }
select_alt = { fg = "#25be6a", bg = "#252525" }
unset_main = { fg = "#161616", bg = "#be95ff", bold = true }
unset_alt = { fg = "#be95ff", bg = "#252525" }

[status]
perm_sep = { fg = "#535353" }
perm_type = { fg = "#78a9ff" }
perm_read = { fg = "#25be6a" }
perm_write = { fg = "#08bdba" }
perm_exec = { fg = "#ee5396" }
progress_label = { fg = "#f2f4f8", bold = true }
progress_normal = { fg = "#25be6a", bg = "#353535" }
progress_error = { fg = "#08bdba", bg = "#ee5396" }

[pick]
border = { fg = "#78a9ff" }
active = { fg = "#be95ff", bold = true }
inactive = {}

[input]
border = { fg = "#78a9ff" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#78a9ff" }

[tasks]
border = { fg = "#78a9ff" }
title = {}
hovered = { fg = "#be95ff", bold = true }

[which]
border = { fg = "#78a9ff" }
cand = { fg = "#33b1ff" }
rest = { fg = "#6e6f70" }
desc = { fg = "#be95ff" }
separator = "  "
separator_style = { fg = "#535353" }

[help]
on = { fg = "#33b1ff" }
run = { fg = "#be95ff" }
hovered = { reversed = true, bold = true }
footer = { fg = "#161616", bg = "#f2f4f8" }

[spot]
border = { fg = "#78a9ff" }
title = { fg = "#78a9ff" }
tbl_col = { fg = "#33b1ff" }
tbl_cell = { fg = "#be95ff", bg = "#353535" }

[notify]
title_info = { fg = "#25be6a" }
title_warn = { fg = "#08bdba" }
title_error = { fg = "#ee5396" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#33b1ff" },
  { mime = "**/{audio,video}/*", fg = "#08bdba" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#be95ff" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#25be6a" },
  { mime = "vfs/{absent,stale}", fg = "#6e6f70" },
  { url = "*", fg = "#f2f4f8" },
  { url = "*/", fg = "#78a9ff" },
]
