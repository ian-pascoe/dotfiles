# Kanagawa Dragon local Yazi flavor

[mgr]
cwd = { fg = "#8ba4b0" }
find_keyword = { fg = "#c4b28a", bold = true, italic = true }
find_position = { fg = "#a292a3", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#87a987", bg = "#87a987" }
marker_cut = { fg = "#c4746e", bg = "#c4746e" }
marker_marked = { fg = "#8ea4a2", bg = "#8ea4a2" }
marker_selected = { fg = "#c4b28a", bg = "#c4b28a" }
count_copied = { fg = "#181616", bg = "#87a987" }
count_cut = { fg = "#181616", bg = "#c4746e" }
count_selected = { fg = "#181616", bg = "#c4b28a" }
border_symbol = "│"
border_style = { fg = "#625e5a" }

[tabs]
active = { fg = "#181616", bg = "#8ba4b0", bold = true }
inactive = { fg = "#8ba4b0", bg = "#282727" }

[mode]
normal_main = { fg = "#181616", bg = "#8ba4b0", bold = true }
normal_alt = { fg = "#8ba4b0", bg = "#282727" }
select_main = { fg = "#181616", bg = "#8ea4a2", bold = true }
select_alt = { fg = "#8ea4a2", bg = "#282727" }
unset_main = { fg = "#181616", bg = "#a292a3", bold = true }
unset_alt = { fg = "#a292a3", bg = "#282727" }

[status]
perm_sep = { fg = "#625e5a" }
perm_type = { fg = "#8ba4b0" }
perm_read = { fg = "#87a987" }
perm_write = { fg = "#c4b28a" }
perm_exec = { fg = "#c4746e" }
progress_label = { fg = "#c5c9c5", bold = true }
progress_normal = { fg = "#87a987", bg = "#2d4f67" }
progress_error = { fg = "#c4b28a", bg = "#c4746e" }

[pick]
border = { fg = "#8ba4b0" }
active = { fg = "#a292a3", bold = true }
inactive = {}

[input]
border = { fg = "#8ba4b0" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#8ba4b0" }

[tasks]
border = { fg = "#8ba4b0" }
title = {}
hovered = { fg = "#a292a3", bold = true }

[which]
border = { fg = "#8ba4b0" }
cand = { fg = "#8ea4a2" }
rest = { fg = "#737c73" }
desc = { fg = "#a292a3" }
separator = "  "
separator_style = { fg = "#625e5a" }

[help]
on = { fg = "#8ea4a2" }
run = { fg = "#a292a3" }
hovered = { reversed = true, bold = true }
footer = { fg = "#181616", bg = "#c5c9c5" }

[spot]
border = { fg = "#8ba4b0" }
title = { fg = "#8ba4b0" }
tbl_col = { fg = "#8ea4a2" }
tbl_cell = { fg = "#a292a3", bg = "#2d4f67" }

[notify]
title_info = { fg = "#87a987" }
title_warn = { fg = "#c4b28a" }
title_error = { fg = "#c4746e" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#8ea4a2" },
  { mime = "**/{audio,video}/*", fg = "#c4b28a" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#a292a3" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#87a987" },
  { mime = "vfs/{absent,stale}", fg = "#737c73" },
  { url = "*", fg = "#c5c9c5" },
  { url = "*/", fg = "#8ba4b0" },
]
