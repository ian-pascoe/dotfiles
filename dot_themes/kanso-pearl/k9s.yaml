      chartBgColor: default
      dialBgColor: default
      defaultDialColors:
        - "#6F894E"
        - "#C84053"
      defaultChartColors:
        - "#6F894E"
        - "#C84053"
      resourceColors:
        cpu:
          - "#4D699B"
          - "#597B75"
        mem:
          - "#6F894E"
          - "#836F4A"
