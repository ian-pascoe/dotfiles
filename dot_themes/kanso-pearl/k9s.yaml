# Hand-derived from the webhooked/kanso.nvim "pearl" palette.
k9s:
  body:
    fgColor: "#22262D"
    bgColor: default
    logoColor: "#4D699B"
  prompt:
    fgColor: "#22262D"
    bgColor: default
    suggestColor: "#4D699B"
  help:
    fgColor: "#22262D"
    bgColor: default
    sectionColor: "#6F894E"
    keyColor: "#4D699B"
    numKeyColor: "#C84053"
  frame:
    title:
      fgColor: "#597B75"
      bgColor: default
      highlightColor: "#624C83"
      counterColor: "#836F4A"
      filterColor: "#6F894E"
    border:
      fgColor: "#4D699B"
      focusColor: "#5E857A"
    menu:
      fgColor: "#22262D"
      keyColor: "#4D699B"
      numKeyColor: "#C84053"
    crumbs:
      fgColor: "#22262D"
      bgColor: default
      activeColor: "#836F4A"
    status:
      newColor: "#4D699B"
      modifyColor: "#597B75"
