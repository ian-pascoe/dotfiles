      fgColor: "#22262D"
      bgColor: default
      indicator:
        fgColor: "#597B75"
        bgColor: default
        toggleOnColor: "#6F894E"
        toggleOffColor: "#6D6D69"
  dialog:
    fgColor: "#836F4A"
    bgColor: default
    buttonFgColor: "#22262D"
    buttonBgColor: default
    buttonFocusFgColor: "#F2F1EF"
    buttonFocusBgColor: "#624C83"
    labelFgColor: "#836F4A"
    fieldFgColor: "#22262D"
