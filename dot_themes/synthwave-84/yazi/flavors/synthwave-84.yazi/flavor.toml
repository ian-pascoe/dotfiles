# SynthWave '84 local Yazi flavor

[mgr]
cwd = { fg = "#FF7EDB" }
find_keyword = { fg = "#FEDE5D", bold = true, italic = true }
find_position = { fg = "#B180D7", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#72F1B8", bg = "#72F1B8" }
marker_cut = { fg = "#FE4450", bg = "#FE4450" }
marker_marked = { fg = "#36F9F6", bg = "#36F9F6" }
marker_selected = { fg = "#FEDE5D", bg = "#FEDE5D" }
count_copied = { fg = "#262335", bg = "#72F1B8" }
count_cut = { fg = "#262335", bg = "#FE4450" }
count_selected = { fg = "#262335", bg = "#FEDE5D" }
border_symbol = "│"
border_style = { fg = "#614D85" }

[tabs]
active = { fg = "#262335", bg = "#FF7EDB", bold = true }
inactive = { fg = "#FF7EDB", bg = "#2A2139" }

[mode]
normal_main = { fg = "#262335", bg = "#FF7EDB", bold = true }
normal_alt = { fg = "#FF7EDB", bg = "#2A2139" }
select_main = { fg = "#262335", bg = "#72F1B8", bold = true }
select_alt = { fg = "#72F1B8", bg = "#2A2139" }
unset_main = { fg = "#262335", bg = "#B180D7", bold = true }
unset_alt = { fg = "#B180D7", bg = "#2A2139" }

[status]
perm_sep = { fg = "#614D85" }
perm_type = { fg = "#FF7EDB" }
perm_read = { fg = "#72F1B8" }
perm_write = { fg = "#FEDE5D" }
perm_exec = { fg = "#FE4450" }
progress_label = { fg = "#FFFFFF", bold = true }
progress_normal = { fg = "#72F1B8", bg = "#413E4E" }
progress_error = { fg = "#262335", bg = "#FE4450" }

[pick]
border = { fg = "#FF7EDB" }
active = { fg = "#B180D7", bold = true }
inactive = {}

[input]
border = { fg = "#FF7EDB" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#FF7EDB" }

[tasks]
border = { fg = "#FF7EDB" }
title = {}
hovered = { fg = "#B180D7", bold = true }

[which]
border = { fg = "#FF7EDB" }
cand = { fg = "#36F9F6" }
rest = { fg = "#848BBD" }
desc = { fg = "#B180D7" }
separator = "  "
separator_style = { fg = "#614D85" }

[help]
on = { fg = "#36F9F6" }
run = { fg = "#B180D7" }
hovered = { reversed = true, bold = true }
footer = { fg = "#262335", bg = "#FFFFFF" }

[spot]
border = { fg = "#FF7EDB" }
title = { fg = "#FF7EDB" }
tbl_col = { fg = "#36F9F6" }
tbl_cell = { fg = "#B180D7", bg = "#413E4E" }

[notify]
title_info = { fg = "#72F1B8" }
title_warn = { fg = "#FEDE5D" }
title_error = { fg = "#FE4450" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#03EDF9" },
  { mime = "**/{audio,video}/*", fg = "#FEDE5D" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B180D7" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#72F1B8" },
  { mime = "vfs/{absent,stale}", fg = "#848BBD" },
  { url = "*", fg = "#FFFFFF" },
  { url = "*/", fg = "#FF7EDB" },
]
