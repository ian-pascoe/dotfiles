# Hand-mapped from Material Theme "Lighter" palette from marko-cerovac/material.nvim "lighter" style (92f7366); green, yellow and cyan taken from its high_visibility lighter variant for contrast on #FAFAFA. Terminal: hand-mapped (Ghostty's bundled "Material" is a different #EAEAEA light theme).
