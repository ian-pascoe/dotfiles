# Darcula local Yazi flavor

[mgr]
cwd = { fg = "#6897BB" }
find_keyword = { fg = "#FFC66D", bold = true, italic = true }
find_position = { fg = "#9876AA", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#6A8759", bg = "#6A8759" }
marker_cut = { fg = "#FF6B68", bg = "#FF6B68" }
marker_marked = { fg = "#6FAFBD", bg = "#6FAFBD" }
marker_selected = { fg = "#FFC66D", bg = "#FFC66D" }
count_copied = { fg = "#202020", bg = "#6A8759" }
count_cut = { fg = "#202020", bg = "#FF6B68" }
count_selected = { fg = "#202020", bg = "#FFC66D" }
border_symbol = "│"
border_style = { fg = "#4B4E4F" }

[tabs]
active = { fg = "#202020", bg = "#6897BB", bold = true }
inactive = { fg = "#6897BB", bg = "#2B2B2B" }

[mode]
normal_main = { fg = "#202020", bg = "#6897BB", bold = true }
normal_alt = { fg = "#6897BB", bg = "#2B2B2B" }
select_main = { fg = "#202020", bg = "#6A8759", bold = true }
select_alt = { fg = "#6A8759", bg = "#2B2B2B" }
unset_main = { fg = "#202020", bg = "#9876AA", bold = true }
unset_alt = { fg = "#9876AA", bg = "#2B2B2B" }

[status]
perm_sep = { fg = "#4B4E4F" }
perm_type = { fg = "#6897BB" }
perm_read = { fg = "#6A8759" }
perm_write = { fg = "#FFC66D" }
perm_exec = { fg = "#FF6B68" }
progress_label = { fg = "#ADADAD", bold = true }
progress_normal = { fg = "#6A8759", bg = "#214283" }
progress_error = { fg = "#202020", bg = "#FF6B68" }

[pick]
border = { fg = "#6897BB" }
active = { fg = "#9876AA", bold = true }
inactive = {}

[input]
border = { fg = "#6897BB" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#6897BB" }

[tasks]
border = { fg = "#6897BB" }
title = {}
hovered = { fg = "#9876AA", bold = true }

[which]
border = { fg = "#6897BB" }
cand = { fg = "#6FAFBD" }
rest = { fg = "#808080" }
desc = { fg = "#9876AA" }
separator = "  "
separator_style = { fg = "#4B4E4F" }

[help]
on = { fg = "#6FAFBD" }
run = { fg = "#9876AA" }
hovered = { reversed = true, bold = true }
footer = { fg = "#202020", bg = "#ADADAD" }

[spot]
border = { fg = "#6897BB" }
title = { fg = "#6897BB" }
tbl_col = { fg = "#6FAFBD" }
tbl_cell = { fg = "#9876AA", bg = "#214283" }

[notify]
title_info = { fg = "#6A8759" }
title_warn = { fg = "#FFC66D" }
title_error = { fg = "#FF6B68" }

[filetype]
rules = [
  { mime = "**/image/*", fg = "#6FAFBD" },
  { mime = "**/{audio,video}/*", fg = "#FFC66D" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9876AA" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#6A8759" },
  { mime = "vfs/{absent,stale}", fg = "#808080" },
  { url = "*", fg = "#ADADAD" },
  { url = "*/", fg = "#6897BB" },
]
