  read: "#6A8759"
  write: "#FFC66D"
  exec: "#FF6B68"
  exec-sticky: "#9876AA"
  no-access: "#808080"
  octal: "#6FAFBD"
  acl: "#6FAFBD"
  context: "#6897BB"
