        fgColor: "#1c8ca8"
        bgColor: default
        toggleOnColor: "#269d69"
        toggleOffColor: "#918c8e"
  dialog:
    fgColor: "#cc7a0a"
    bgColor: default
    buttonFgColor: "#faf4f2"
    buttonBgColor: "#918c8e"
    buttonFocusFgColor: "#faf4f2"
    buttonFocusBgColor: "#7058be"
    labelFgColor: "#cc7a0a"
    fieldFgColor: "#29242a"
