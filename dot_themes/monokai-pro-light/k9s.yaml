    bgColor: default
    suggestColor: "#cc7a0a"
  help:
    fgColor: "#29242a"
    bgColor: default
    sectionColor: "#269d69"
    keyColor: "#1c8ca8"
    numKeyColor: "#e14775"
  frame:
